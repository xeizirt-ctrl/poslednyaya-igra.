
name: Build game installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.godot || (echo "ERROR: project.godot missing" && exit 1)
          test -f export_presets.cfg || (echo "ERROR: export_presets.cfg missing" && exit 1)
          mkdir -p build
          chmod -R u+rwX .

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android
        run: |
          godot --headless --path . --export-debug "Android Debug" build/poslednyaya_igra.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poslednyaya-igra-android-apk
          path: build/poslednyaya_igra.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.godot || (echo "ERROR: project.godot missing" && exit 1)
          test -f export_presets.cfg || (echo "ERROR: export_presets.cfg missing" && exit 1)
          mkdir -p build/windows
          chmod -R u+rwX .

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Windows
        run: |
          godot --headless --path . --export-release "Windows Desktop" build/windows/poslednyaya_igra.exe

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: poslednyaya-igra-windows
          path: build/windows/
          if-no-files-found: error
          
