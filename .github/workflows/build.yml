name: Build game installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Android build
        run: |
          mkdir -p build
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: |
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Export Android APK
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --export-debug "Android Debug" build/poslednyaya_igra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poslednyaya-igra-android-apk
          path: build/poslednyaya_igra.apk
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Windows build
        run: |
          mkdir -p build/windows
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: |
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Export Windows EXE
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" build/windows/poslednyaya_igra.exe

      - uses: actions/upload-artifact@v4
        with:
          name: poslednyaya-igra-windows
          path: build/windows/*
          if-no-files-found: error
